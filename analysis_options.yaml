include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/core/l10n/generated/**
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    # Apps do not need dartdoc on every public member (it is a library rule).
    public_member_api_docs: false
    # Constructor shorthand (`new`) is not yet idiomatic; keep type names.
    unnecessary_type_name_in_constructor: false
